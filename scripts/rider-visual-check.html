<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Rider and helmet visual check</title>
<style>
body{margin:0;background:#343b3c;color:#eee;font:13px sans-serif}canvas{display:block}
nav{position:absolute;inset:12px 12px auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,select{padding:6px}output{position:absolute;bottom:16px;left:16px;white-space:pre}
</style>
<nav>
  <select aria-label="Bike"></select><select aria-label="Helmet"></select>
  <label><input type="checkbox" id="debug">Rider debug</label>
  <label><input type="checkbox" id="wheelie">Wheelie</label>
  <button id="side">Other side</button><button id="front">Front view</button>
</nav><output>Loading</output>
<script type="module">
import * as THREE from 'three';
import { BIKES_DATABASE } from '/src/game/BikeConfigs.ts';
import { loadBikeModel } from '/src/game/BikeLoader.ts';
import { HELMETS_DATABASE, DEFAULT_HELMET_ID } from '/src/game/Rider/HelmetConfig.ts';
const scene=new THREE.Scene(); scene.background=new THREE.Color('#343b3c');
scene.add(new THREE.HemisphereLight(0xffffff,0x667777,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5); sun.position.set(3,5,2); scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(40,1,.01,100);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()} addEventListener('resize',resize);resize();
const bikeSelect=document.querySelector('[aria-label="Bike"]');
const helmetSelect=document.querySelector('[aria-label="Helmet"]');
for(const bike of BIKES_DATABASE)bikeSelect.add(new Option(bike.name,bike.id));
for(const helmet of HELMETS_DATABASE)helmetSelect.add(new Option(helmet.name,helmet.id));
helmetSelect.value=DEFAULT_HELMET_ID;
let parts,side=1,view='side',request=0;
const output=document.querySelector('output');
async function attachHelmet(){
  if(bikeSelect.disabled)return;
  const token=++request;output.textContent='Loading helmet';
  try{await parts.rider.setHelmet(helmetSelect.value);if(token===request)output.textContent=`${bikeSelect.value} / ${parts.rider.helmetAnchor.children[0]?.name || 'No helmet'} / Ready`}
  catch(error){if(token===request)output.textContent='Error: '+error.message}
}
async function loadBike(){
  bikeSelect.disabled=true;
  if(parts){scene.remove(parts.bikeGroup);parts.rider.dispose();parts.wheelRotationEffect?.dispose()}
  parts=await loadBikeModel(bikeSelect.value);scene.add(parts.bikeGroup);bikeSelect.disabled=false;
  await attachHelmet();
}
bikeSelect.onchange=loadBike;helmetSelect.onchange=attachHelmet;
document.querySelector('#side').onclick=()=>{side*=-1;view='side'};
document.querySelector('#front').onclick=()=>{view=view==='front'?'side':'front'};
await loadBike();
function animate(){
  parts.rider.debug?.setEnabled(document.querySelector('#debug').checked);
  parts.bodyGroup.rotation.x=document.querySelector('#wheelie').checked?-.9:0;
  if(view==='front')camera.position.set(.01,1,3.7);else camera.position.set(side*3.7,.9,.02);
  camera.lookAt(0,.85,0);renderer.render(scene,camera);requestAnimationFrame(animate);
}requestAnimationFrame(animate);
</script></html>
